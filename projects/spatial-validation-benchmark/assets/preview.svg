<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#f8fafc"/><text x="60" y="70" font-family="Arial" font-size="34" font-weight="700" fill="#111827">Spatial Validation Benchmark</text><text x="60" y="108" font-family="Arial" font-size="20" fill="#475569">Why geospatial models need more than random train/test splits</text><g font-family="Arial"><rect x="90" y="175" width="440" height="300" rx="18" fill="#ffffff" stroke="#cbd5e1"/><text x="310" y="220" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">Random split</text><rect x="155" y="385" width="95" height="55" fill="#bfdbfe"/><rect x="270" y="320" width="95" height="120" fill="#93c5fd"/><rect x="385" y="265" width="95" height="175" fill="#60a5fa"/><text x="317" y="465" text-anchor="middle" font-size="18" fill="#334155">Can look optimistic</text><rect x="670" y="175" width="440" height="300" rx="18" fill="#ffffff" stroke="#cbd5e1"/><text x="890" y="220" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">Spatial holdout</text><rect x="735" y="410" width="95" height="30" fill="#bbf7d0"/><rect x="850" y="350" width="95" height="90" fill="#86efac"/><rect x="965" y="300" width="95" height="140" fill="#4ade80"/><text x="892" y="465" text-anchor="middle" font-size="18" fill="#334155">More defensible</text><path d="M540 325 H655" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><text x="600" y="525" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Random Forest • spatial blocks • accuracy • precision • recall • F1</text><text x="600" y="558" text-anchor="middle" font-size="18" fill="#475569">Focus: model validation, data limitations, and technical risk communication</text></g></svg>