 + metadata</text><path d="M280 250 H350" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><path d="M560 250 H630" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><path d="M840 250 H910" stroke="#64748b" stroke-width="5" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs><rect x="105" y="390" width="990" height="135" rx="16" fill="#ffffff" stroke="#d1d5db"/><text x="135" y="430" font-size="20" font-weight="700" fill="#111827">Recruiter takeaway</text><text x="135" y="465" font-size="18" fill="#374151">Reproducible raster processing • automated QA/QC • documented handoff outputs</text><text x="135" y="500" font-size="18" fill="#374151">Python • Rasterio • NumPy • Pandas • Matplotlib</text></g></svg>